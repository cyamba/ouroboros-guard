[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ouroboros-guard"
version = "0.1.0"
description = "Leakage and circularity guardrails for agentic science, math and engineering: the outcome must never be an ancestor of the prediction."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Christopher Yamba" }]
keywords = ["leakage", "agentic-ai", "reproducibility", "scientific-method", "proof-checking", "evaluation", "llm-agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
oguard = "ouroboros_guard.cli:main"

[project.urls]
Homepage = "https://github.com/cyamba/ouroboros-guard"
Essay = "https://www.christopheryamba.com/posts/the-ouroboros-problem/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
